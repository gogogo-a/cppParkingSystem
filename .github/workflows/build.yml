name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc

    - name: Compile Parking System
      shell: msys2 {0}
      run: |
        g++ -o ParkingSystem.exe main.cpp car.cpp user.cpp admin.cpp -I. -std=c++11 -static -Wall

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ParkingSystem-Windows
        path: ParkingSystem.exe

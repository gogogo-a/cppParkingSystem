name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup GCC
      uses: fortran-lang/setup-cpp@v1
      with:
        compiler: gcc
        version: 11

    - name: Compile Parking System
      run: |
        g++ -o ParkingSystem.exe main.cpp car.cpp user.cpp admin.cpp -I. -std=c++11 -static -Wall

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ParkingSystem-Windows
        path: ParkingSystem.exe
